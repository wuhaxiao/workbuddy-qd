name: WorkBuddy 每日自动签到

# 触发方式：只保留手动/API 触发（workflow_dispatch）
# 定时由宝塔计划任务调用 GitHub API 来踢，不依赖 GitHub 自带 cron
on:
  workflow_dispatch:

# 防止宝塔两次触发（12:47 / 13:08）重叠运行
concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 打印触发信息
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "北京时间 : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - name: 执行签到
        env:
          WORKBUDDY_ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # 以下两个用于 token 自动续期后把新 refresh token 写回 Secret
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          SECRET_NAME: WORKBUDDY_ACCOUNTS
        run: python checkin.py
